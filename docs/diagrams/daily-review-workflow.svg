<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1270" viewBox="0 0 1600 1270" role="img" aria-labelledby="title desc">
<title id="title">每日研究工作流 · 流程示意</title>
<desc id="desc">盘前竞价固定09:25:30自动采集。盘中观察可自动采集八档，上午含09:35和09:45。午评时间可配置，午间报价独立保存。累计简报串联竞价、盘中、午评和正式收盘，AI可按时点解读。正式盘后数据链默认和最早17:00启动，按顺序完成核验和已授权的任务。新安装默认关闭自动计划。</desc>
<g font-family="-apple-system,BlinkMacSystemFont,&#x27;PingFang SC&#x27;,&#x27;Microsoft YaHei&#x27;,sans-serif">
<rect x="0" y="0" width="1600" height="1270" rx="0" fill="#0c1524"/><rect x="20" y="20" width="1560" height="1230" rx="26" fill="#0c1524" stroke="#354b69" stroke-width="2"/><text x="54" y="66" font-size="21" fill="#9eafca" font-weight="500" text-anchor="start">冒险的梦想家 · 行情 / 策略 / 研究</text><rect x="1194" y="41" width="350" height="43" rx="8" fill="#24334e"/><text x="1369" y="69" font-size="20" fill="#80adff" font-weight="600" text-anchor="middle">流程示意</text><text x="54" y="126" font-size="40" fill="#e8effc" font-weight="700" text-anchor="start">从盘前观察，到盘后持续跟踪</text><text x="54" y="169" font-size="23" fill="#9eafca" font-weight="400" text-anchor="start">四类计划显式开启后，由唯一 worker 按已核验交易日与有效窗口执行。</text><rect x="52" y="212" width="468" height="447" rx="18" fill="#18283f" stroke="#354b69" stroke-width="2"/><rect x="82" y="241" width="52" height="39" rx="8" fill="#263a57"/><text x="108" y="269" font-size="21" fill="#80adff" font-weight="700" text-anchor="middle">01</text><text x="153" y="272" font-size="30" fill="#e8effc" font-weight="650" text-anchor="start">盘前竞价</text><text x="82" y="337" font-size="47" fill="#80adff" font-weight="700" text-anchor="start">09:25:30</text><text x="82" y="376" font-size="21" fill="#9eafca" font-weight="400" text-anchor="start">固定时间 · 仅自动采集</text><path d="M82 401H490" fill="none" stroke="#354b69" stroke-width="2"/><text x="82" y="447" font-size="25" fill="#e8effc" font-weight="600" text-anchor="start">昨日强势 → 今日竞价</text><text x="82" y="490" font-size="22" fill="#9eafca" font-weight="400" text-anchor="start">昨日板高与竞价涨幅分层观察</text><text x="82" y="529" font-size="22" fill="#9eafca" font-weight="400" text-anchor="start">行业 / 概念和上市板块交集筛选</text><text x="82" y="568" font-size="22" fill="#9eafca" font-weight="400" text-anchor="start">已核验报价与缺口分别展示</text><rect x="78" y="600" width="416" height="34" rx="7" fill="#22354e"/><text x="286" y="624" font-size="20" fill="#80adff" font-weight="500" text-anchor="middle">竞价参考不证明全天一字</text><rect x="566" y="212" width="468" height="447" rx="18" fill="#18283f" stroke="#354b69" stroke-width="2"/><rect x="596" y="241" width="52" height="39" rx="8" fill="#263a57"/><text x="622" y="269" font-size="21" fill="#b39aef" font-weight="700" text-anchor="middle">02</text><text x="667" y="272" font-size="30" fill="#e8effc" font-weight="650" text-anchor="start">午评快照</text><text x="596" y="337" font-size="47" fill="#b39aef" font-weight="700" text-anchor="start">12:05</text><text x="596" y="376" font-size="21" fill="#9eafca" font-weight="400" text-anchor="start">新安装默认时间 · 可配置</text><path d="M596 401H1004" fill="none" stroke="#354b69" stroke-width="2"/><text x="596" y="447" font-size="25" fill="#e8effc" font-weight="600" text-anchor="start">午间形成中 → 收盘回看</text><text x="596" y="490" font-size="22" fill="#9eafca" font-weight="400" text-anchor="start">观察市场广度、接力与当前梯队</text><text x="596" y="529" font-size="22" fill="#9eafca" font-weight="400" text-anchor="start">展开本次冻结的板块与成分股</text><text x="596" y="568" font-size="22" fill="#9eafca" font-weight="400" text-anchor="start">午间报价与正式收盘日 K 分开</text><rect x="592" y="600" width="416" height="34" rx="7" fill="#22354e"/><text x="800" y="624" font-size="20" fill="#b39aef" font-weight="500" text-anchor="middle">不把午间报价写入收盘日 K</text><rect x="1080" y="212" width="468" height="447" rx="18" fill="#18283f" stroke="#354b69" stroke-width="2"/><rect x="1110" y="241" width="52" height="39" rx="8" fill="#263a57"/><text x="1136" y="269" font-size="21" fill="#e9c16c" font-weight="700" text-anchor="middle">03</text><text x="1181" y="272" font-size="30" fill="#e8effc" font-weight="650" text-anchor="start">盘后更新</text><text x="1110" y="337" font-size="47" fill="#e9c16c" font-weight="700" text-anchor="start">17:00</text><text x="1110" y="376" font-size="21" fill="#9eafca" font-weight="400" text-anchor="start">新安装默认 / 最早可选</text><path d="M1110 401H1518" fill="none" stroke="#354b69" stroke-width="2"/><text x="1110" y="447" font-size="25" fill="#e8effc" font-weight="600" text-anchor="start">数据核验 → 选股与跟踪</text><text x="1110" y="490" font-size="22" fill="#9eafca" font-weight="400" text-anchor="start">主行情与盘面补充各自核验</text><text x="1110" y="529" font-size="22" fill="#9eafca" font-weight="400" text-anchor="start">按策略开关计算、保存与入池</text><text x="1110" y="568" font-size="22" fill="#9eafca" font-weight="400" text-anchor="start">全部已授权步骤结束后确认</text><rect x="1106" y="600" width="416" height="34" rx="7" fill="#22354e"/><text x="1314" y="624" font-size="20" fill="#e9c16c" font-weight="500" text-anchor="middle">完整数据链结束前保持锁定</text><path d="M531 426h23m-7 -6l7 6 -7 6" fill="none" stroke="#6b87af" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M1045 426h23m-7 -6l7 6 -7 6" fill="none" stroke="#6b87af" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="52" y="685" width="1496" height="220" rx="18" fill="#18283f" stroke="#354b69" stroke-width="2"/>
<text x="82" y="728" font-size="27" fill="#e8effc" font-weight="650">盘中观察 · 八档采集</text>
<text x="1516" y="728" font-size="20" fill="#9eafca" text-anchor="end">在数据中心独立开启</text>
<rect x="82" y="748" width="168" height="45" rx="9" fill="#22354e" stroke="#354b69" stroke-width="2"/>
<text x="166" y="778" font-size="23" fill="#80adff" font-weight="650" text-anchor="middle">09:35</text>
<rect x="263" y="748" width="168" height="45" rx="9" fill="#2a4266" stroke="#354b69" stroke-width="2"/>
<text x="347" y="778" font-size="23" fill="#80adff" font-weight="650" text-anchor="middle">09:45</text>
<rect x="444" y="748" width="168" height="45" rx="9" fill="#22354e" stroke="#354b69" stroke-width="2"/>
<text x="528" y="778" font-size="23" fill="#80adff" font-weight="650" text-anchor="middle">10:00</text>
<rect x="625" y="748" width="168" height="45" rx="9" fill="#22354e" stroke="#354b69" stroke-width="2"/>
<text x="709" y="778" font-size="23" fill="#80adff" font-weight="650" text-anchor="middle">10:30</text>
<rect x="806" y="748" width="168" height="45" rx="9" fill="#22354e" stroke="#354b69" stroke-width="2"/>
<text x="890" y="778" font-size="23" fill="#80adff" font-weight="650" text-anchor="middle">11:00</text>
<rect x="987" y="748" width="168" height="45" rx="9" fill="#22354e" stroke="#354b69" stroke-width="2"/>
<text x="1071" y="778" font-size="23" fill="#80adff" font-weight="650" text-anchor="middle">13:30</text>
<rect x="1168" y="748" width="168" height="45" rx="9" fill="#22354e" stroke="#354b69" stroke-width="2"/>
<text x="1252" y="778" font-size="23" fill="#80adff" font-weight="650" text-anchor="middle">14:00</text>
<rect x="1349" y="748" width="168" height="45" rx="9" fill="#22354e" stroke="#354b69" stroke-width="2"/>
<text x="1433" y="778" font-size="23" fill="#80adff" font-weight="650" text-anchor="middle">14:30</text>
<text x="82" y="838" font-size="22" fill="#e8effc">09:45 对比 09:35，10:00 对比 09:45。点时段查看方向、板况和个股。</text>
<text x="82" y="875" font-size="22" fill="#9eafca">累计简报串联竞价、各档观察、午评和正式收盘。各档可带着当前时点进入 AI 解读。</text>
<g transform="translate(0 230)">
<rect x="52" y="701" width="1496" height="223" rx="18" fill="#18283f" stroke="#354b69" stroke-width="2"/><text x="82" y="747" font-size="27" fill="#e8effc" font-weight="650" text-anchor="start">盘后完整数据链</text><text x="1516" y="747" font-size="20" fill="#9eafca" font-weight="400" text-anchor="end">选股与自动入池开关独立保存</text><rect x="84" y="780" width="212" height="64" rx="10" fill="#22354e" stroke="#354b69" stroke-width="2"/><text x="190" y="821" font-size="25" fill="#80adff" font-weight="600" text-anchor="middle">主行情</text><path d="M305 812h17m-7 -6l7 6 -7 6" fill="none" stroke="#6b87af" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="328" y="780" width="212" height="64" rx="10" fill="#22354e" stroke="#354b69" stroke-width="2"/><text x="434" y="821" font-size="25" fill="#80adff" font-weight="600" text-anchor="middle">板块尾部</text><path d="M549 812h17m-7 -6l7 6 -7 6" fill="none" stroke="#6b87af" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="572" y="780" width="212" height="64" rx="10" fill="#22354e" stroke="#354b69" stroke-width="2"/><text x="678" y="821" font-size="25" fill="#80adff" font-weight="600" text-anchor="middle">盘面补充</text><path d="M793 812h17m-7 -6l7 6 -7 6" fill="none" stroke="#6b87af" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="816" y="780" width="212" height="64" rx="10" fill="#22354e" stroke="#354b69" stroke-width="2"/><text x="922" y="821" font-size="25" fill="#b39aef" font-weight="600" text-anchor="middle">选股策略</text><path d="M1037 812h17m-7 -6l7 6 -7 6" fill="none" stroke="#6b87af" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="1060" y="780" width="212" height="64" rx="10" fill="#22354e" stroke="#354b69" stroke-width="2"/><text x="1166" y="821" font-size="25" fill="#b39aef" font-weight="600" text-anchor="middle">跟踪核对</text><path d="M1281 812h17m-7 -6l7 6 -7 6" fill="none" stroke="#6b87af" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="1304" y="780" width="212" height="64" rx="10" fill="#22354e" stroke="#354b69" stroke-width="2"/><text x="1410" y="821" font-size="25" fill="#b39aef" font-weight="600" text-anchor="middle">划线提醒</text><text x="82" y="886" font-size="23" fill="#9eafca" font-weight="400" text-anchor="start">全链运行中锁定业务操作；全部已授权步骤结束后，确认结果再解锁。</text><rect x="52" y="960" width="405" height="43" rx="8" fill="#24334e"/><text x="254" y="989" font-size="22" fill="#80adff" font-weight="600" text-anchor="middle">新安装默认关闭自动计划</text><text x="484" y="990" font-size="23" fill="#9eafca" font-weight="400" text-anchor="start">不自动初始化、不跨日追历史；缺数据保持未知。</text>
</g>
</g>
</svg>
