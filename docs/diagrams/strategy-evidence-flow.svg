<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1180" viewBox="0 0 1600 1180" role="img" aria-labelledby="title desc">
<title id="title">证据、存储与选股复用 · v0.1.15</title>
<desc id="desc">功能流程示意。真实来源经SHA、日期与价格复权口径核验，分层存入业务SQLite和不可变Parquet共享行情。日及完整周月指标使用有界技术输入缓存，再按当前规则组合历史事件、今日条件并保存运行，显式入池后独立跟踪。个股策略按相同业务日、规则和有效输入复用已完成运行；参数、条件或相关来源改变则重新判断。缺数保持unknown。行情、补充和龙虎榜各用独立活动窗口，受业务引用保护。</desc>
<g font-family="-apple-system,BlinkMacSystemFont,&#x27;PingFang SC&#x27;,&#x27;Microsoft YaHei&#x27;,sans-serif">
<rect x="0" y="0" width="1600" height="1180" rx="0" fill="#0c1524"/><rect x="20" y="20" width="1560" height="1140" rx="26" fill="#0c1524" stroke="#354b69" stroke-width="2"/><text x="54" y="66" font-size="21" fill="#9eafca" font-weight="500" text-anchor="start">冒险的梦想家 · 行情 / 策略 / 研究</text><rect x="1194" y="41" width="350" height="43" rx="8" fill="#24334e"/><text x="1369" y="69" font-size="20" fill="#80adff" font-weight="600" text-anchor="middle">功能流程示意 · v0.1.15</text><text x="54" y="126" font-size="40" fill="#e8effc" font-weight="700" text-anchor="start">让每次筛选，都能对上数据与依据</text><text x="54" y="169" font-size="23" fill="#9eafca" font-weight="400" text-anchor="start">复用已核验输入，保留原始证据；行情、规则、日期和价格口径各自清楚。</text><rect x="52" y="212" width="344" height="207" rx="18" fill="#18283f" stroke="#354b69" stroke-width="2"/><text x="76" y="252" font-size="19" fill="#80adff" font-weight="700" text-anchor="start">01</text><text x="119" y="254" font-size="28" fill="#e8effc" font-weight="650" text-anchor="start">真实来源</text><text x="76" y="302" font-size="21" fill="#9eafca" font-weight="400" text-anchor="start">指定日期与明确来源</text><text x="76" y="341" font-size="21" fill="#9eafca" font-weight="400" text-anchor="start">保留原始响应与参数</text><text x="76" y="380" font-size="21" fill="#9eafca" font-weight="400" text-anchor="start">不把演示值当真实数据</text><rect x="436" y="212" width="344" height="207" rx="18" fill="#18283f" stroke="#354b69" stroke-width="2"/><text x="460" y="252" font-size="19" fill="#4ac2d4" font-weight="700" text-anchor="start">02</text><text x="503" y="254" font-size="28" fill="#e8effc" font-weight="650" text-anchor="start">统一核验</text><text x="460" y="302" font-size="21" fill="#9eafca" font-weight="400" text-anchor="start">来源 SHA 与完整性</text><text x="460" y="341" font-size="21" fill="#9eafca" font-weight="400" text-anchor="start">观察日与价格 / 复权口径</text><text x="460" y="380" font-size="21" fill="#9eafca" font-weight="400" text-anchor="start">覆盖不足保持待核验</text><rect x="820" y="212" width="344" height="207" rx="18" fill="#18283f" stroke="#354b69" stroke-width="2"/><text x="844" y="252" font-size="19" fill="#b39aef" font-weight="700" text-anchor="start">03</text><text x="887" y="254" font-size="28" fill="#e8effc" font-weight="650" text-anchor="start">分层存储</text><text x="844" y="302" font-size="21" fill="#9eafca" font-weight="400" text-anchor="start">业务 SQLite 短事务</text><text x="844" y="341" font-size="21" fill="#9eafca" font-weight="400" text-anchor="start">不可变 Parquet 共享对象</text><text x="844" y="380" font-size="21" fill="#9eafca" font-weight="400" text-anchor="start">行情按月分片与增量链</text><rect x="1204" y="212" width="344" height="207" rx="18" fill="#18283f" stroke="#354b69" stroke-width="2"/><text x="1228" y="252" font-size="19" fill="#e9c16c" font-weight="700" text-anchor="start">04</text><text x="1271" y="254" font-size="28" fill="#e8effc" font-weight="650" text-anchor="start">技术输入</text><text x="1228" y="302" font-size="21" fill="#9eafca" font-weight="400" text-anchor="start">日 / 完整周 / 完整月</text><text x="1228" y="341" font-size="21" fill="#9eafca" font-weight="400" text-anchor="start">BOLL 参数组独立核验</text><text x="1228" y="380" font-size="21" fill="#9eafca" font-weight="400" text-anchor="start">有界缓存，失效后重算</text><path d="M407 315h18m-7 -6l7 6 -7 6" fill="none" stroke="#6b87af" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M791 315h18m-7 -6l7 6 -7 6" fill="none" stroke="#6b87af" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M1175 315h18m-7 -6l7 6 -7 6" fill="none" stroke="#6b87af" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M1376 426v23m-6 -7l6 7 6 -7" fill="none" stroke="#6b87af" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="52" y="468" width="1496" height="278" rx="18" fill="#18283f" stroke="#354b69" stroke-width="2"/><text x="82" y="513" font-size="27" fill="#e8effc" font-weight="650" text-anchor="start">按当前规则求值：组合历史事件与今日条件</text><rect x="84" y="540" width="456" height="121" rx="10" fill="#22354e" stroke="#354b69" stroke-width="2"/><text x="106" y="577" font-size="25" fill="#80adff" font-weight="600" text-anchor="start">历史事件（可选）</text><text x="106" y="612" font-size="21" fill="#e8effc" font-weight="400" text-anchor="start">倍量 / 涨停 / 价格结构</text><text x="106" y="644" font-size="20" fill="#9eafca" font-weight="400" text-anchor="start">同一次事件绑定日期与参照价</text><rect x="572" y="540" width="456" height="121" rx="10" fill="#22354e" stroke="#354b69" stroke-width="2"/><text x="594" y="577" font-size="25" fill="#80adff" font-weight="600" text-anchor="start">今日条件</text><text x="594" y="612" font-size="21" fill="#e8effc" font-weight="400" text-anchor="start">价格 / 放量 / MACD / KDJ / 热点</text><text x="594" y="644" font-size="20" fill="#9eafca" font-weight="400" text-anchor="start">核验所选周期与实际条件</text><rect x="1060" y="540" width="456" height="121" rx="10" fill="#22354e" stroke="#354b69" stroke-width="2"/><text x="1082" y="577" font-size="25" fill="#80adff" font-weight="600" text-anchor="start">已保存运行</text><text x="1082" y="612" font-size="21" fill="#e8effc" font-weight="400" text-anchor="start">命中 / 未命中 / 待核验</text><text x="1082" y="644" font-size="20" fill="#9eafca" font-weight="400" text-anchor="start">显式入池后建立独立跟踪轮次</text><path d="M550 600h14m-7 -6l7 6 -7 6" fill="none" stroke="#6b87af" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M1038 600h14m-7 -6l7 6 -7 6" fill="none" stroke="#6b87af" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="82" y="686" width="1436" height="35" rx="7" fill="#1d3948"/><text x="800" y="711" font-size="22" fill="#4ac2d4" font-weight="500" text-anchor="middle">缺行情 / 缺证据 → 待核验（unknown），不把缺失补成 0。</text><rect x="52" y="782" width="1496" height="191" rx="18" fill="#202d45" stroke="#354b69" stroke-width="2"/><text x="82" y="826" font-size="27" fill="#e8effc" font-weight="650" text-anchor="start">个股选股：同日再点运行，先核验能否复用</text><path d="M800 844L800 941" fill="none" stroke="#354b69" stroke-width="2"/><text x="82" y="872" font-size="23" fill="#47c6a4" font-weight="650" text-anchor="start">同规则 + 同业务日 + 同有效输入</text><text x="82" y="908" font-size="22" fill="#9eafca" font-weight="400" text-anchor="start">返回原 run，不重复计算，不因此自动加入跟踪。</text><text x="842" y="872" font-size="23" fill="#e9c16c" font-weight="650" text-anchor="start">参数 / 条件 / 相关来源变化</text><text x="842" y="908" font-size="22" fill="#9eafca" font-weight="400" text-anchor="start">重新判断并保存新运行，技术输入仍可分层复用。</text><text x="82" y="950" font-size="20" fill="#9eafca" font-weight="400" text-anchor="start">仅改名称或跟踪政策，不会把已完成的相同配置重新算一遍。</text><rect x="52" y="1007" width="468" height="90" rx="12" fill="#18283f" stroke="#354b69" stroke-width="2"/><text x="76" y="1045" font-size="25" fill="#80adff" font-weight="650" text-anchor="start">行情目标近 5 年</text><text x="76" y="1077" font-size="20" fill="#9eafca" font-weight="400" text-anchor="start">历史引用与来源缺口独立保留</text><rect x="566" y="1007" width="468" height="90" rx="12" fill="#18283f" stroke="#354b69" stroke-width="2"/><text x="590" y="1045" font-size="25" fill="#b39aef" font-weight="650" text-anchor="start">盘面补充 250 交易日</text><text x="590" y="1077" font-size="20" fill="#9eafca" font-weight="400" text-anchor="start">年度统计、业务引用有独立保护</text><rect x="1080" y="1007" width="468" height="90" rx="12" fill="#18283f" stroke="#354b69" stroke-width="2"/><text x="1104" y="1045" font-size="25" fill="#e9c16c" font-weight="650" text-anchor="start">龙虎榜 30 交易日</text><text x="1104" y="1077" font-size="20" fill="#9eafca" font-weight="400" text-anchor="start">单日与三日榜分别留存</text><text x="52" y="1138" font-size="21" fill="#9eafca" font-weight="400" text-anchor="start">活动窗口不等于磁盘总占用上限；来源核验、缓存命中与首次全市场计算的耗时分别验收。</text>
</g>
</svg>
