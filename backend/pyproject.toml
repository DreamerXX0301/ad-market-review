[project]
name = "ad-market-review-backend"
version = "0.1.14"
description = "冒险的梦想家 A股盘面与策略研究工作台"
requires-python = ">=3.13,<3.15"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic>=2.10,<3",
  "httpx>=0.28,<1",
  "duckdb==1.5.6",
  "numpy>=2.2,<3",
  "pandas>=2.2,<4",
  "pyarrow>=19,<30",
  "cryptography>=44,<50",
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
package = false
